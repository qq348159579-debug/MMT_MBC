server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index MBC工时与物料管理工具.html;

    charset utf-8;

    location = / {
        try_files /MBC工时与物料管理工具.html =404;
    }

    location / {
        try_files $uri $uri/ /MBC工时与物料管理工具.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
